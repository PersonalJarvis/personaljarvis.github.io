<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"/><meta name="viewport" content="width=1440,height=1264"/>
  <title>Jarvis Agents — native feature window</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1440px;height:1264px;overflow:hidden;background:#0a0a09}
    #film{position:relative;width:1440px;height:1264px;overflow:hidden}
    .scene-content{width:100%;height:100%;padding:0;display:flex;flex-direction:column}
    iframe{display:block;width:1200px;height:1053.333333px;flex-shrink:0;transform:scale(1.2);transform-origin:0 0;border:0;pointer-events:none}
    #pointer{position:absolute;left:0;top:0;z-index:8;width:36px;height:44px;opacity:0;transform-origin:0 0}
    #pointer svg{display:block;width:100%;height:100%}
  </style>
</head><body>
<!-- The website supplies the shared 76px WindowChrome above this 1264px body. -->
<div id="film" data-composition-id="jarvis-agents" data-start="0" data-duration="28" data-width="1440" data-height="1264">
  <div class="scene-content" data-layout-allow-overflow="The fixed app viewport is scaled uniformly to the shared design-pixel canvas.">
    <iframe id="product" src="app/index.html" title="Jarvis Agents example workflow"></iframe>
  </div>
  <div id="pointer" aria-hidden="true"><svg viewBox="0 0 36 44"><path d="M3 2L30 25L19 27L25 39L19 42L13 29L4 37Z" fill="#f7f7f4" stroke="#0a0a09" stroke-width="2"/></svg></div>
</div>
<script>
  const product=document.getElementById('product');
  const tl=gsap.timeline({paused:true});
  tl.set('#pointer',{x:1280,y:205,opacity:1},0)
    .to('#pointer',{x:1250,y:230,duration:1.2,ease:'sine.inOut'},0);
  tl.set('#pointer',{x:1280,y:205,opacity:1},1.3)
    .to('#pointer',{scale:.8,duration:.1,ease:'power2.in'},1.8)
    .to('#pointer',{x:720,y:1000,scale:1,duration:.6,ease:'power2.inOut'},2.1)
    .to('#pointer',{x:700,y:530,duration:.8,ease:'power2.inOut'},4.2)
    .to('#pointer',{x:440,y:720,duration:.65,ease:'power2.inOut'},7)
    .to('#pointer',{x:600,y:760,duration:.8,ease:'power2.inOut'},10.8);
  tl.set('#pointer',{x:1280,y:290,scale:1,opacity:1},14.3)
    .to('#pointer',{scale:.8,duration:.1,ease:'power2.in'},14.8)
    .to('#pointer',{x:720,y:1080,scale:1,duration:.6,ease:'power2.inOut'},15.1)
    .to('#pointer',{x:700,y:640,duration:.7,ease:'power2.inOut'},18)
    .to('#pointer',{x:190,y:180,duration:.6,ease:'power2.inOut'},20.4)
    .to('#pointer',{x:710,y:660,duration:.7,ease:'power2.inOut'},21.1);
  tl.set('#pointer',{x:1060,y:450,scale:1,opacity:1},26.4)
    .to('#pointer',{x:1280,y:205,duration:.9,ease:'power2.inOut'},26.5)
    .to('#pointer',{x:1280,y:205,duration:.3,ease:'sine.inOut'},27.7);
  function draw(time=tl.time()){if(product.contentWindow?.renderDemoAt)product.contentWindow.renderDemoAt(time);}
  tl.eventCallback('onUpdate',()=>draw());
  window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data?.type==='jarvis-demo-ready')draw();});
  window.addEventListener('hf-seek',event=>draw(event.detail.time));
  window.__timelines=window.__timelines||{};
  window.__timelines['jarvis-agents']=tl;
</script>
</body></html>
