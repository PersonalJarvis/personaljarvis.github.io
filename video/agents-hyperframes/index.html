<!doctype html>
<html lang="en"><head>
 <meta charset="utf-8"/><meta name="viewport" content="width=1080,height=1080"/>
 <title>Jarvis Agents — sharp native capture</title>
 <script src="assets/gsap.min.js"></script>
 <style>
  *{box-sizing:border-box}html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#0a0a09}
  #film{position:relative;width:1080px;height:1080px;overflow:hidden}
  .scene-content{width:1080px;height:948px;padding:0;display:flex;flex-direction:column;overflow:hidden}
  iframe{display:block;width:1440px;height:1264px;flex-shrink:0;transform:scale(.75);transform-origin:0 0;border:0;pointer-events:none}
  #pointer{position:absolute;left:0;top:0;z-index:8;width:30px;height:36px;opacity:1}
  #pointer svg{display:block;width:100%;height:100%}
  #click{position:absolute;left:0;top:0;width:26px;height:26px;border:2px solid #f7f7f4;border-radius:50%;z-index:7;opacity:0;pointer-events:none}
 </style>
</head><body>
<!-- Render at square-4k (DPR 2), then crop only the bottom export padding.
     The visible 2160x1896 movie preserves the shared 1440x1264 body ratio. -->
<div id="film" data-composition-id="jarvis-agents" data-start="0" data-duration="28" data-width="1080" data-height="1080">
 <div class="scene-content" data-layout-allow-overflow="Uniform downsampling into the export canvas; no camera animation.">
  <iframe id="product" src="app/index.html" title="Original Jarvis Agents components with example data"></iframe>
 </div>
 <div id="pointer" aria-hidden="true"><svg viewBox="0 0 40 48"><path d="M0 0L31 27L19 29L26 43L19 47L12 32L1 41Z" fill="#f7f7f4" stroke="#0a0a09" stroke-width="2"/></svg></div>
 <div id="click" aria-hidden="true"></div>
</div>
<script>
 const product=document.getElementById('product');
 const pointer=document.getElementById('pointer');
 const click=document.getElementById('click');
 const tl=gsap.timeline({paused:true});
 tl.fromTo('#pointer',{opacity:0},{opacity:1,duration:.12},0);
 tl.to('#pointer',{opacity:0,duration:.15},7.14);
 tl.to('#pointer',{opacity:1,duration:.15},14.75);
 tl.to('#pointer',{opacity:0,duration:.2},27.8);
 function draw(time=tl.time()){
  const state=product.contentWindow?.renderDemoAt?.(time);
  if(!state)return;
  pointer.style.transform=`translate(${state.cursor.x*.75}px,${state.cursor.y*.75}px)`;
  if(state.click){click.style.left=`${state.click.x*.75-13}px`;click.style.top=`${state.click.y*.75-13}px`;}
  window.__demoFrame=state;
 }
 tl.eventCallback('onUpdate',()=>draw());
 window.__timelines=window.__timelines||{};
 window.addEventListener('message',event=>{
  if(event.origin!==location.origin)return;
  if(event.data?.type==='jarvis-demo-error')throw new Error(event.data.message);
  if(event.data?.type==='jarvis-demo-ready'){
    for(const {at} of product.contentWindow.demoClickLog)tl.fromTo('#click',{opacity:.8,scale:.6},{opacity:0,scale:1.3,duration:.13,ease:'power2.out',immediateRender:false},at);
    draw(0);window.__timelines['jarvis-agents']=tl;window.__hfForceTimelineRebind?.();
  }
 });
 window.addEventListener('hf-seek',event=>draw(event.detail.time));
</script>
</body></html>
