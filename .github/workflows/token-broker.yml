# Unit tests for the OAuth token broker Worker (workers/token-broker).
#
# Only tests run here. Deploying needs a Cloudflare credential that this
# repository does not hold on purpose; see the Worker's README.
name: token-broker

on:
  pull_request:
    paths: ["workers/token-broker/**", ".github/workflows/token-broker.yml"]
  push:
    branches: [main]
    paths: ["workers/token-broker/**", ".github/workflows/token-broker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test workers/token-broker/test/broker.test.mjs
