name: Restore verified CLI website

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  restore:
    # A standard public-repository runner; no paid larger runner is used.
    runs-on: macos-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the verified original website source
        run: |
          git diff --exit-code f995b3a4ac68ceb5db9acb1aa0159ce9ab708251 HEAD -- . ':!.github'
      - name: Restore the previously successful Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 36297011279
          github-token: ${{ github.token }}
          path: restored-pages
      - name: Attach the unchanged Pages archive to this deployment
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: restored-pages/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - name: Publish the verified original UI
        id: deployment
        uses: actions/deploy-pages@v4
