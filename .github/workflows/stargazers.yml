# Star events in the app repository update the live feed. This job only
# refreshes the static/no-JavaScript fallback used at build time.
name: stargazers

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stargazers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the public aggregate feed
        run: node --experimental-strip-types scripts/sync-stargazer-feed.mjs
      - name: Commit if it changed
        run: |
          if git diff --quiet -- src/data/stargazers.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stargazers): refresh the globe's markers" \
            --only -- src/data/stargazers.json
          git pull --rebase --ff-only
          git push
